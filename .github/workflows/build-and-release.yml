name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'
      create_release:
        description: 'Create GitHub Release on completion'
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Project Structure & Locate Gradle Wrapper
        id: locate_gradlew
        run: |
          echo "=== Verifying Project Structure ==="
          pwd
          ls -la

          # Search for gradlew in the workspace root or subdirectories
          GRADLEW_PATH=$(find . -maxdepth 2 -name "gradlew" -type f | head -n 1)

          if [ -z "$GRADLEW_PATH" ] || [ ! -f "$GRADLEW_PATH" ]; then
            echo "gradlew not found. Generating Gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1
            GRADLEW_PATH="./gradlew"
          fi

          echo "Found Gradle wrapper at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          ls -la "$GRADLEW_PATH"

          # Verify it can be executed
          "$GRADLEW_PATH" --version

          echo "gradle_cmd=$GRADLEW_PATH" >> $GITHUB_ENV
          echo "gradle_cmd=$GRADLEW_PATH" >> $GITHUB_OUTPUT

      - name: Prepare Secrets Configuration
        run: |
          touch .env
          if [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Run Unit Tests
        run: |
          ${{ env.gradle_cmd }} testDebugUnitTest --no-daemon

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type == 'debug' }}
        run: |
          ${{ env.gradle_cmd }} assembleDebug --no-daemon

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: |
          ${{ env.gradle_cmd }} assembleRelease --no-daemon || ${{ env.gradle_cmd }} assembleDebug --no-daemon
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Locate Output APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK file found in app/build/outputs/apk" >&2
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          APK_NAME=$(basename "$APK_PATH")
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tome-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: Tome-APK
          path: release-artifacts

      - name: Rename Release Asset
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ] || [ "$TAG_NAME" = "master" ]; then
            TAG_NAME="v1.0.0-$(date +'%Y%m%d%H%M')"
          fi
          echo "RELEASE_TAG=$TAG_NAME" >> $GITHUB_ENV
          mv release-artifacts/*.apk release-artifacts/Tome-${TAG_NAME}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Tome Release ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/Tome-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
